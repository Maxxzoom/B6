<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="logo">
        <img src="https://th.wallhaven.cc/lg/qr/qr27rq.jpg" alt="" />
      </div>
      <nav class="nav-links" id="nav-links">
        <a href="./index.html">Home</a>
        <a href="./shop.html">Shop</a>
        <a href="./about.html">About</a>
        <a href="./contact.html">Contact</a>

        <a href="">🛒 Cart <span id="cart-count">0</span> </a>
      </nav>
      <button class="menu-toggle" id="menu-toggle">&#9776;</button>
    </header>

    <section class="filters">
      <input type="text" id="search" placeholder="Search Products" />
      <select name="" id="category-filter">
        <option value="all">All Categories</option>
        <option value="clothes">Clothes</option>
        <option value="shoes">Shoes</option>
        <option value="accessories">Accessories</option>
        <option value="elctronics">Elctronics</option>
      </select>
    </section>
    <!-- Products -->

    <main>
      <h2>Products</h2>
      <div class="product-list" id="product-list"></div>

      <!-- Cart section -->
      <div class="cart" id="cart">
        <h2>Your Cart</h2>
        <p class="cartCount"></p>
        <ul id="cart-items"></ul>
        <p id="cart-total">Total :$0</p>
        <p id="cart-total"></p>
        <button id="checkout">Checkout</button>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <div class="footer-content">
        <p>&copy; 2025 My shop. All right reserved</p>
        <div class="socials">
          <a href="#">Facebook</a>
          <a href="#">Instagram</a><a href="#">Twitter</a>
        </div>
      </div>
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
